# CI of every pull request: lint, typecheck, unit tests and build (Paso 7).
# The job id "checks" is the name deploy.yml looks for; keep them in sync.
# test:rls and test:e2e run locally against producette-dev (they need real credentials).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values with a valid shape: lib/env.ts validates the format and the
      # local guards (dev Supabase ref, test Stripe keys); nothing connects during the build.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: https://aeypdriubewywzngjzgf.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SECRET_KEY: sb_secret_ci
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      STRIPE_SECRET_KEY: sk_test_ci
      CRON_SECRET: ci-placeholder-secret-of-at-least-32-chars
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
